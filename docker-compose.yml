services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: milieu
      POSTGRES_PASSWORD: milieu
      POSTGRES_DB: milieu
    ports:
      - "5544:5432"
    volumes:
      - milieu_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milieu -d milieu"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  milieu_pg_data:
